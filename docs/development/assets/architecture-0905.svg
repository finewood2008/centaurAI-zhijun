<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1150" viewBox="0 0 1600 1150" role="img" aria-labelledby="title desc">
<title id="title">知君完整产品 Electron 与盒端 v2 架构</title><desc id="desc">Vue十五页经主进程受控接口、SDK Direct、Agent逐请求签名到DE Gateway，Gateway管理加密任务与独立UDS领域worker，并复用DE基础能力。v2盒端已匹配部署，Admin发布和正式Consumer/SDK/UI验收待完成。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#667085"/></marker></defs>
<style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#182230}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#475467}.group{font-size:21px;font-weight:700}.head{font-size:20px;font-weight:650}.body{font-size:17px}.small{font-size:15px;fill:#475467}.line{fill:none;stroke:#667085;stroke-width:2;marker-end:url(#arrow)}.dash{stroke-dasharray:6 5}</style>
<rect width="1600" height="1150" fill="#f7f9fc"/>
<text x="50" y="61" class="title">知君完整产品 · Electron / 盒端 v2</text>
<text x="50" y="95" class="sub">2026-09-06 · 盒端 v2 已匹配部署；Admin 发布及正式 Consumer / SDK / UI 验收待完成</text>
<rect x="50" y="122" width="1500" height="62" rx="12" fill="#fff5dc" stroke="#e6c574"/>
<text x="72" y="148" class="body">原 15 页 / 170 项受控操作：95 领域 · 54 资料 · 21 模型</text>
<text x="72" y="173" class="small">保留 v1 只读兼容；历史空资料页和一次重连仅为旧链路证据，不能代替完整产品验收。</text>
<rect x="50" y="210" width="455" height="626" rx="18" fill="#edf4ff" stroke="#b2c8ee"/>
<text x="73" y="247" class="group">PC 桌面</text>
<rect x="545" y="210" width="455" height="626" rx="18" fill="#f1f6f3" stroke="#b7d5c4"/>
<text x="568" y="247" class="group">盒端入口与任务</text>
<rect x="1040" y="210" width="510" height="626" rx="18" fill="#f5f0ff" stroke="#c9b8e4"/>
<text x="1063" y="247" class="group">盒端领域与 canonical 能力</text>
<rect x="73" y="268" width="409" height="121" rx="10" fill="white" stroke="#c5cdd8"/><text x="91" y="299" class="head">Vue 原产品 + hash router</text><text x="91" y="328" class="body">导航 / 草稿 / 来源确认 / SSE 消费</text><text x="91" y="353" class="body">录音按钮 → 受控 WAV 转写</text><text x="91" y="378" class="body">不持有票据 / 不访问 PC HTTP</text><rect x="73" y="436" width="409" height="143" rx="10" fill="white" stroke="#c5cdd8"/><text x="91" y="467" class="head">Electron preload / main</text><text x="91" y="496" class="body">typed IPC + operationId / generation</text><text x="91" y="521" class="body">170 项 catalog 二次校验</text><text x="91" y="546" class="body">登录 / 上传 / 原生保存 / 媒体句柄</text><text x="91" y="571" class="body">凭据和 SDK 留在主进程</text><rect x="73" y="626" width="409" height="155" rx="10" fill="white" stroke="#c5cdd8"/><text x="91" y="657" class="head">Connectivity SDK 1.2.0</text><text x="91" y="686" class="body">sidecar + Core · Direct-only</text><text x="91" y="711" class="body">整响应 request / close</text><text x="91" y="736" class="body">无原生 SSE / 单请求 abort API</text><text x="91" y="761" class="body">应用流由短任务 + 游标事件承载</text><path d="M277 389 V436" class="line"/><path d="M277 579 V626" class="line"/><rect x="568" y="268" width="409" height="121" rx="10" fill="white" stroke="#c5cdd8"/><text x="586" y="299" class="head">Remote Agent · v2 Ed25519</text><text x="586" y="328" class="body">zhijun-desktop / zhijun.workspace</text><text x="586" y="353" class="body">每次重验 Owner / grant / Direct</text><text x="586" y="378" class="body">仅 10 条 RPC · body SHA + MIME</text><rect x="568" y="436" width="409" height="168" rx="10" fill="white" stroke="#c5cdd8"/><text x="586" y="467" class="head">DE workspace Gateway</text><text x="586" y="496" class="body">证明 / nonce / client / session 校验</text><text x="586" y="521" class="body">start → poll / cancel · 每页有界</text><text x="586" y="546" class="body">30 秒 Owner 租约 · 每盒 4 worker</text><text x="586" y="571" class="body">重启 interrupted，不自动重放写入</text><text x="586" y="596" class="body">4 运行 / 8 排队（每 workspace）</text><rect x="568" y="651" width="409" height="130" rx="10" fill="white" stroke="#c5cdd8"/><text x="586" y="682" class="head">私有 AES-GCM 传输存储</text><text x="586" y="711" class="body">任务 / 事件 / 上传 / blob / ledger</text><text x="586" y="736" class="body">512 KiB 块 · 200 MiB 文件</text><text x="586" y="761" class="body">1 GiB 磁盘 · TTL + 去重墓碑</text><path d="M977 482 H1019 V340 H1063" class="line"/><path d="M773 389 V436" class="line"/><path d="M773 604 V651" class="line"/><path d="M482 706 H527 V329 H568" class="line"/><rect x="1063" y="268" width="464" height="146" rx="10" fill="white" stroke="#c5cdd8"/><text x="1081" y="299" class="head">独立 UDS 知君领域 worker</text><text x="1081" y="328" class="body">workspace = hash(device, account, epoch)</text><text x="1081" y="353" class="body">会话 / 本体 / 判断 / 章程 / 事项成果</text><text x="1081" y="378" class="body">独立进程 + 目录 + 文件锁</text><text x="1081" y="403" class="body">不启动旧 server 全局 watcher / 模型</text><rect x="1063" y="462" width="464" height="121" rx="10" fill="white" stroke="#c5cdd8"/><text x="1081" y="493" class="head">DE 基础能力与模型授权</text><text x="1081" y="522" class="body">资料 / 版本 / 检索 / 图谱 / 模型</text><text x="1081" y="547" class="body">HMAC 内部端口 + 有效执行租约</text><text x="1081" y="572" class="body">consent 绑定 UI / 来源 / 配置 / 摘要</text><rect x="1063" y="631" width="464" height="150" rx="10" fill="white" stroke="#c5cdd8"/><text x="1081" y="662" class="head">持久领域与 canonical 数据</text><text x="1081" y="691" class="body">领域 SQLite / 投影：独立 domain root</text><text x="1081" y="716" class="body">资料 / 模型 / 索引：由 DE 维护</text><text x="1081" y="741" class="body">旧 global 不自动归属；Claim 不双写</text><text x="1081" y="766" class="body">来源 outbox → HMAC 事件 → 幂等 ACK</text><path d="M1295 414 V462" class="line"/><path d="M1295 583 V631" class="line"/><path d="M977 550 H1063" class="line"/><text x="1008" y="456" class="small" transform="rotate(-90 1008 456)">UDS / HMAC</text><rect x="50" y="867" width="1500" height="226" rx="14" fill="white" stroke="#c5cdd8"/>
<text x="73" y="902" class="group">传输与发布约束</text>
<text x="73" y="938" class="body">JSON / SSE：start + poll（最长 8 秒、32 事件 / 256 KiB）；UTF-8 持续解码；取消不承诺数据库回滚。</text>
<text x="73" y="970" class="body">文件：v2 512 KiB / 0-based 暂存 → 业务 multipart；blob 有界读取；主进程预览 / 保存，不开放盒子 URL。</text>
<text x="73" y="1002" class="body">Agent：1 MiB 请求 / 响应 · 8 并发 · 120 rpm · 1 GiB 会话；Core 1024 请求限制不变，不自动重连刷额度。</text>
<text x="73" y="1034" class="body">发布：Admin 新应用 → Agent 二进制与清单 → DE + worker + catalog / 私有路径 → 桌面 → 真实逐功能验收。</text>
<text x="73" y="1071" class="small">安全边界：新 domain root 不进入 DE 个人记忆退役清理；AES-GCM 传输存储不等于全部领域 / 原件自动加密。</text>
</svg>
