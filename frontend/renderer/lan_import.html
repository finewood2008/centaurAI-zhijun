<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>半人马AI 私有记忆库 · 文件导入</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f7f2ea;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fffdf9;border-radius:16px;padding:32px;width:420px;box-shadow:0 6px 20px rgba(80,55,25,.1)}
h1{font-size:20px;margin-bottom:8px;color:#2c2620}
.sub{font-size:13px;color:#8c8276;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#2c2620}
input[type=password]{width:100%;padding:10px 12px;border:1.5px solid #ece2d3;border-radius:10px;font-size:14px;outline:none;margin-bottom:16px;background:#fbf6ee}
input:focus{border-color:#c2622e}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.15s}
.btn-prim{background:#c2622e;color:#fff}
.btn-prim:hover{background:#a8531f}
.btn-prim:disabled{opacity:.6}
#drop-zone{margin-top:12px;border:2px dashed #e0d3bf;border-radius:12px;padding:32px;text-align:center;cursor:pointer;transition:.18s;background:#fbf6ee}
#drop-zone.drag{border-color:#c2622e;background:#f6e7d8}
.dz-icon{font-size:32px;margin-bottom:8px}
.dz-text{font-size:13px;color:#8c8276}
.dz-hint{font-size:11px;color:#b3a896;margin-top:4px}
#progress{margin-top:12px;font-size:13px;color:#8c8276;text-align:center}
#msg{margin-top:12px;font-size:13px;text-align:center;min-height:20px}
.msg-ok{color:#4e9a6b}.msg-err{color:#c0503f}
#login-panel,#upload-panel{display:none}
#login-panel.show,#upload-panel.show{display:block}
.logout{float:right;font-size:12px;color:#c2622e;cursor:pointer;background:none;border:none}
#file-input{display:none}
</style>
</head>
<body>
<div class="card">
<h1>半人马AI 私有记忆库 <button class="logout" id="logout-btn" style="display:none">退出</button></h1>
<p class="sub">局域网文件导入</p>

<div id="login-panel" class="show">
<label>访问密码</label>
<input type="password" id="password" placeholder="输入访问密码…" onkeydown="if(event.key==='Enter')login()">
<button class="btn btn-prim" onclick="login()">登录</button>
<p id="msg"></p>
</div>

<div id="upload-panel">
<div id="drop-zone" onclick="document.getElementById('file-input').click()">
<div class="dz-icon">📂</div>
<div class="dz-text">点击或拖拽文件到此处</div>
<div class="dz-hint">PDF · Word · Excel · PPT · Markdown · 图片 · 视频</div>
</div>
<input type="file" id="file-input" multiple accept=".pdf,.docx,.xlsx,.xlsm,.xls,.pptx,.md,.txt,.jpg,.jpeg,.png,.bmp,.gif,.webp,.mp4,.mov,.mkv,.webm,.avi,.m4v" onchange="uploadFiles(this.files)">
<div id="progress"></div>
<p id="msg2"></p>
</div>
</div>

<script>
var token = localStorage.getItem('vdb_lan_token') || '';

function showPanel(p) {
    document.getElementById('login-panel').classList.toggle('show', p==='login');
    document.getElementById('upload-panel').classList.toggle('show', p==='upload');
    document.getElementById('logout-btn').style.display = p==='upload' ? '' : 'none';
}

async function login() {
    var pw = document.getElementById('password').value;
    var el = document.getElementById('msg');
    if (!pw) { el.textContent='请输入密码'; return }
    try {
        var r = await fetch('/lan/login', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw})});
        var d = await r.json();
        if (d.token) { token = d.token; localStorage.setItem('vdb_lan_token', token); showPanel('upload'); }
        else { el.textContent = d.detail || '密码错误'; el.className = 'msg-err'; }
    } catch(e) { el.textContent='登录失败'; el.className='msg-err' }
}

function logout() { token = ''; localStorage.removeItem('vdb_lan_token'); showPanel('login'); }

async function uploadFiles(files) {
    if (!files || !files.length) return;
    var el = document.getElementById('msg2'), prog = document.getElementById('progress');
    for (var i = 0; i < files.length; i++) {
        prog.textContent = '上传中 ' + (i+1) + '/' + files.length + '：' + files[i].name;
        var fd = new FormData(); fd.append('file', files[i]);
        try {
            var r = await fetch('/lan/upload', {method:'POST',headers:{'X-Lan-Token':token},body:fd});
            if (!r.ok) {
                var errText = await r.text().catch(function(){ return '' });
                try { var j = JSON.parse(errText); errText = j.detail || errText; } catch(_) {}
                el.textContent = '❌ ' + files[i].name + '：' + (errText || 'HTTP '+r.status);
                el.className = 'msg-err'; continue;
            }
            var d = await r.json();
            el.textContent = '✅ 已导入 ' + files.length + ' 个文件，后台索引中'; el.className = 'msg-ok'; prog.textContent = '';
        } catch(e) { el.textContent = '❌ ' + files[i].name + '：网络错误'; el.className = 'msg-err'; }
    }
    document.getElementById('file-input').value = '';
}

var dz = document.getElementById('drop-zone');
dz.addEventListener('dragover', function(e){ e.preventDefault(); dz.classList.add('drag') });
dz.addEventListener('dragleave', function(){ dz.classList.remove('drag') });
dz.addEventListener('drop', function(e){ e.preventDefault(); dz.classList.remove('drag'); uploadFiles(e.dataTransfer.files); });

if (token) { fetch('/lan/status', {headers:{'X-Lan-Token':token}}).then(r=>r.json()).then(d=>{ if(d.ok)showPanel('upload'); else logout(); }).catch(logout); }
document.getElementById('logout-btn').addEventListener('click', logout);
</script>
</body>
</html>
